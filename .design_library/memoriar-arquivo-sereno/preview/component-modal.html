<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Modal</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
body { margin: 0; padding: 12px; background: var(--color-surface); font-family: var(--font-body); color: var(--color-on-surface); }
.row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 10px; }
.label { font-size: 10px; color: var(--color-muted-foreground); min-width: 80px; max-width: 100px; font-weight: var(--font-weight-caption); text-transform: uppercase; letter-spacing: 0.5px; flex-shrink: 0; padding-top: var(--space-3); }
.divider { border: none; border-top: 1px solid var(--color-border); margin: 4px 0 10px; }
.scene { flex: 1 0 0; width: 100%; min-height: 320px; padding: var(--space-6); border: 1px solid var(--color-outline-variant); border-radius: var(--radius-lg); background: var(--color-background); box-shadow: var(--shadow-2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.scrim { width: 100%; padding: var(--space-6); border-radius: var(--radius-md); background: color-mix(in srgb, var(--color-on-surface) 8%, var(--color-background)); display: flex; justify-content: center; }
.modal { width: min(100%, 560px); background: var(--color-card); border: 1px solid var(--color-border); border-radius: var(--radius-lg); box-shadow: var(--shadow-5); overflow: hidden; }
.modal.warning { border-color: var(--color-outline); }
.modal-header { padding: var(--space-5) var(--space-5) var(--space-4); border-bottom: 1px solid var(--color-outline-variant); background: var(--color-surface-container-low); }
.modal.warning .modal-header { box-shadow: inset 0 2px 0 0 var(--color-warning); }
.title { margin: 0; font-family: var(--font-heading); font-size: 1.5rem; line-height: 1.25; color: var(--color-on-surface); }
.body { padding: var(--space-5); background: var(--color-card); }
.message { margin: 0; font-size: var(--font-size-body); line-height: 1.55; color: var(--color-on-surface-variant); }
.actions { display: flex; justify-content: flex-end; gap: var(--space-3); padding: var(--space-4) var(--space-5) var(--space-5); border-top: 1px solid var(--color-outline-variant); background: var(--color-surface-container-low); }
.button { min-width: 128px; height: 44px; padding: 0 var(--space-4); border-radius: var(--radius-md); border: 1px solid var(--color-border); background: var(--color-surface-container-high); color: var(--color-on-surface); font-family: var(--font-body); font-size: var(--font-size-body); font-weight: var(--font-weight-body); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.button.primary { border-color: var(--color-primary); background: var(--color-primary); color: var(--color-on-primary); box-shadow: var(--shadow-2); }
</style>
</head>
<body>
  <div class="row">
    <span class="label">Confirmar publicação</span>
    <div class="scene">
      <div class="scrim">
        <div class="modal">
          <div class="modal-header">
            <h1 class="title">Confirmar publicação</h1>
          </div>
          <div class="body">
            <p class="message">Confirmar publicação.</p>
          </div>
          <div class="actions">
            <button class="button" type="button">Cancelar</button>
            <button class="button primary" type="button">Confirmar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <hr class="divider">
  <div class="row">
    <span class="label">Registrar inconsistência</span>
    <div class="scene">
      <div class="scrim">
        <div class="modal warning">
          <div class="modal-header">
            <h1 class="title">Registrar inconsistência</h1>
          </div>
          <div class="body">
            <p class="message">Registrar inconsistência.</p>
          </div>
          <div class="actions">
            <button class="button" type="button">Cancelar</button>
            <button class="button primary" type="button">Confirmar</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
