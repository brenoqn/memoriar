<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="../../colors_and_type.css">
  <link rel="stylesheet" href="../../components.css">
  <title>Memoriar UI Kit — Dashboard</title>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/lucide@1.8.0/dist/umd/lucide.min.js"></script>
  <style>
    :root {
      --uikit-sidebar-w: 260px;
      --uikit-max-copy: 54ch;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--background); color: var(--foreground); font-family: var(--font-body); }
    body { min-height: 100vh; }
    #root { min-height: 100vh; }
    button, input { font: inherit; }

    .uikit-shell{width:100%;max-width:1184px;margin:0 auto;overflow:hidden;display:grid;grid-template-columns:var(--uikit-sidebar-w, 220px) minmax(0,1fr);gap:var(--space-4);padding:var(--space-5)}
    .uikit-sidebar,.uikit-main,.uikit-toolbar{min-width:0}
    .uikit-sidebar{overflow:hidden;max-width:100%}
    [data-component]{min-width:0;max-width:100%;overflow:hidden}
    .uikit-toolbar{display:flex;align-items:center;gap:var(--space-2)}
    .uikit-responsive-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--space-4)}
    .uikit-table-wrap{max-width:100%;overflow-x:auto;overscroll-behavior-x:contain}
    .uikit-truncate{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .uikit-nowrap{white-space:nowrap;flex-shrink:0}
    .uikit-action-cell{display:flex;align-items:center;gap:8px;min-width:0;max-width:160px;overflow:hidden}
    .uikit-action{min-width:0;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

    .uikit-rail {
      min-height: calc(100vh - var(--space-8));
      display: grid;
      align-content: start;
      gap: var(--space-5);
      padding: var(--space-5);
      background: var(--surface-container-low);
    }

    .uikit-brand-block,
    .uikit-note-block,
    .uikit-footer {
      display: grid;
      gap: var(--space-3);
      min-width: 0;
    }

    .uikit-brand-mark {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      background: var(--color-primary-container);
      color: var(--color-primary);
      font: var(--type-h3);
      font-family: var(--font-heading);
    }

    .uikit-brand-title,
    .uikit-screen-title,
    .uikit-panel-title {
      margin: 0;
      font-family: var(--font-heading);
      color: var(--foreground);
      word-break: keep-all;
      overflow-wrap: break-word;
      text-wrap: balance;
    }

    .uikit-brand-title { font: var(--type-h2); }
    .uikit-screen-title { font: var(--type-h1); max-width: 18ch; }
    .uikit-panel-title { font: var(--type-h3); }

    .uikit-copy,
    .uikit-foot,
    .uikit-microcopy {
      margin: 0;
      color: var(--muted-foreground);
      font: var(--type-body);
    }

    .uikit-foot,
    .uikit-microcopy { font: var(--type-caption); }

    .uikit-view-switch {
      display: grid;
      gap: var(--space-2);
      min-width: 0;
    }

    .uikit-view-tab {
      min-height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--space-2);
      padding: 0 var(--space-4);
      border: 1px solid var(--outline-variant);
      background: var(--surface-bright);
      color: var(--foreground);
      cursor: pointer;
      transition: background 160ms cubic-bezier(.2,.8,.2,1), border-color 160ms cubic-bezier(.2,.8,.2,1), color 160ms cubic-bezier(.2,.8,.2,1);
      white-space: nowrap;
    }

    .uikit-view-tab.is-active {
      background: var(--color-primary-container);
      border-color: var(--color-primary);
      color: var(--color-on-primary-container);
    }

    .uikit-screen {
      display: grid;
      gap: var(--space-5);
      min-width: 0;
      align-content: start;
    }

    .uikit-screen-header {
      display: grid;
      gap: var(--space-3);
      min-width: 0;
      padding: var(--space-5) 0 var(--space-2);
    }

    .uikit-header-meta,
    .uikit-inline-meta,
    .uikit-chipline {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
      min-width: 0;
    }

    .uikit-header-meta { justify-content: space-between; }

    .uikit-stage-card,
    .uikit-airy-grid,
    .uikit-public-flow,
    .uikit-admin-grid,
    .uikit-modal-wrap {
      display: grid;
      gap: var(--space-4);
      min-width: 0;
    }

    .uikit-stage-card {
      padding: var(--space-5);
      background: var(--surface);
    }

    .uikit-hero-grid,
    .uikit-detail-grid {
      display: grid;
      grid-template-columns: minmax(0,1.15fr) minmax(300px,.85fr);
      gap: var(--space-5);
      min-width: 0;
    }

    .uikit-airy-grid {
      grid-template-columns: repeat(3,minmax(0,1fr));
    }

    .uikit-section-stack,
    .uikit-card-stack,
    .uikit-support-list,
    .uikit-stack {
      display: grid;
      gap: var(--space-3);
      min-width: 0;
    }

    .uikit-card-stack { gap: var(--space-4); }

    .uikit-input-group,
    .uikit-button-row {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      flex-wrap: wrap;
      min-width: 0;
    }

    .uikit-field-wide { width: min(100%, 420px); }

    .uikit-note-block {
      padding-top: var(--space-4);
      border-top: 1px solid var(--color-border);
    }

    .uikit-logical-map-shell {
      padding: var(--space-5);
      background: var(--surface-container-low);
    }

    .uikit-card-tile {
      padding: var(--space-4);
      background: var(--surface-container-low);
    }

    .uikit-card-tile .card-meta {
      align-items: flex-start;
      flex-wrap: wrap;
    }

    .uikit-detail-grid {
      align-items: start;
    }

    .uikit-public-flow {
      grid-template-columns: minmax(0,1fr) minmax(0,360px);
    }

    .uikit-admin-grid {
      grid-template-columns: var(--sidebar-width) minmax(0,1fr);
      align-items: start;
    }

    .uikit-kpi-grid {
      display: grid;
      grid-template-columns: repeat(4,minmax(0,1fr));
      gap: var(--space-4);
      min-width: 0;
    }

    .uikit-kpi-value {
      margin: 0;
      font: var(--type-h2);
      font-family: var(--font-heading);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .uikit-kpi-card {
      padding: var(--space-4);
      background: var(--surface);
    }

    .uikit-admin-main {
      display: grid;
      gap: var(--space-4);
      min-width: 0;
    }

    .uikit-modal-wrap {
      grid-template-columns: minmax(0,1fr) minmax(320px,.8fr);
      align-items: start;
    }

    .uikit-empty-block {
      display: grid;
      gap: var(--space-3);
      padding: var(--space-5);
      background: var(--surface-container-low);
      min-width: 0;
    }

    .uikit-footer {
      padding-top: var(--space-4);
      border-top: 1px solid var(--color-border);
    }

    .uikit-link-row {
      display: flex;
      align-items: center;
      gap: var(--space-3);
      flex-wrap: wrap;
      min-width: 0;
    }

    .uikit-link-row a {
      color: var(--link);
      text-decoration: none;
      font: var(--type-caption);
      white-space: nowrap;
    }

    .icon-sm { width: 16px; height: 16px; display: inline-block; }
    .icon-md { width: 20px; height: 20px; display: inline-block; }
    .icon-lg { width: 24px; height: 24px; display: inline-block; }

    @media (hover: none) {
      .uikit-view-tab { transition-duration: 0.01ms; }
    }

    @media (max-width: 900px){.uikit-shell{grid-template-columns:minmax(0,1fr)}.uikit-responsive-grid{grid-template-columns:minmax(0,1fr)}
      .uikit-hero-grid,
      .uikit-detail-grid,
      .uikit-public-flow,
      .uikit-admin-grid,
      .uikit-modal-wrap,
      .uikit-kpi-grid,
      .uikit-airy-grid { grid-template-columns:minmax(0,1fr); }
    }

    @media (max-width: 640px){.uikit-toolbar{flex-direction:column;align-items:stretch}.uikit-responsive-grid{grid-template-columns:minmax(0,1fr)}
      .uikit-shell { padding: var(--space-4); }
      .uikit-rail,
      .uikit-stage-card,
      .uikit-logical-map-shell,
      .uikit-empty-block { padding: var(--space-4); }
      .uikit-view-tab { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
        scroll-behavior: auto !important;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useEffect, useMemo, useState } = React;

    const homeResults = [
      {

    ];

    const adminMetrics = [
      { title: "Casos publicados", value: "1.248", text: "Com publicação pública ativa e vínculo validado.", badgeClass: "badge soft info-soft", badgeText: "Fluxo estável" },
      { title: "Pendências", value: "18", text: "Registros sem conferência final de localização.", badgeClass: "badge soft warning-soft", badgeText: "Atenção" },
      { title: "Movimentações", value: "42", text: "Atualizações de hoje entre setores e equipes.", badgeClass: "badge soft success-soft", badgeText: "Operação" },
      { title: "Solicitações", value: "27", text: "Pedidos públicos aguardando retorno institucional.", badgeClass: "badge outlined error-outlined", badgeText: "Fila ativa" }
    ];

    const adminRows = [
      { ref: "MEM-1042", name: "Maria de Lourdes Souza", sector: "Setor B • Quadra 3 • Jazigo 18", statusClass: "badge soft success-soft", statusText: "Publicado", owner: "Equipe Norte", date: "30 jun 2026" },
      { ref: "MEM-1078", name: "José Carlos de Almeida", sector: "Alameda 2 • Quadra 7 • Jazigo 04", statusClass: "badge soft warning-soft", statusText: "Em revisão", owner: "Cadastro Central", date: "29 jun 2026" },
      { ref: "MEM-1089", name: "Helena Duarte Ribeiro", sector: "Bosque • Quadra 1 • Jazigo 31", statusClass: "badge outlined error-outlined", statusText: "Pendência", owner: "Qualidade dos dados", date: "29 jun 2026" },
      { ref: "MEM-1097", name: "Pedro Nogueira Lima", sector: "Setor Leste • Quadra 5 • Jazigo 12", statusClass: "badge soft success-soft", statusText: "Publicado", owner: "Equipe Leste", date: "28 jun 2026" },
      { ref: "MEM-1106", name: "Ana Célia Martins", sector: "Jardim Sul • Quadra 8 • Jazigo 02", statusClass: "badge soft warning-soft", statusText: "Em revisão", owner: "Documentação", date: "27 jun 2026" },
      { ref: "MEM-1124", name: "Raimundo Ferreira Costa", sector: "Setor Histórico • Quadra 2 • Jazigo 09", statusClass: "badge soft info-soft", statusText: "Publicado", owner: "Equipe Patrimônio", date: "26 jun 2026" }
    ];

    function Icon({ name, size = "icon-md" }) {
      return <i data-lucide={name} className={size} aria-hidden="true"></i>;
    }

    function NavTabs({ active, onChange }) {
      const items = [
        { id: "publico", label: "Busca pública" },
        { id: "detalhe", label: "Camada de detalhe" },
        { id: "admin", label: "Visão administrativa" }
      ];

      return (
        <div className="uikit-view-switch" role="tablist" aria-label="Selecionar visão">
          {items.map((item) => (
            <button
              key={item.id}
              type="button"
              role="tab"
              aria-selected={active === item.id}
              className={`uikit-view-tab ${active === item.id ? "is-active" : ""}`}
              onClick={() => onChange(item.id)}
            >
              {item.label}
            </button>
          ))}
        </div>
      );
    }

    function Topnav({ active }) {
      return (
        <nav className="topnav" aria-label="Navegação principal" data-component="topnav">
          <a className="brand" href="#memoriar">
            <span className="brand-mark" aria-hidden="true">M</span>
            <span className="brand-text">Memoriar</span>
          </a>
          <div className="nav-links">
            <a className={`nav-link ${active === "consulta" ? "active" : ""}`} href="#consulta">Consulta pública</a>
            <a className={`nav-link ${active === "mapa" ? "active" : ""}`} href="#mapa">Mapa lógico</a>
            <a className={`nav-link ${active === "orientacoes" ? "active" : ""}`} href="#orientacoes">Orientações</a>
          </div>
          <a className="search-btn nav-link" href="#buscar">
            <Icon name="search" size="icon-sm" />
            <span className="uikit-truncate">Buscar falecido</span>
          </a>
          <div className="util-group">
            <button type="button" className="util-btn" aria-label="Avisos">
              <Icon name="bell" size="icon-sm" />
            </button>
            <button type="button" className="util-btn" aria-label="Ajuda">
              <Icon name="help-circle" size="icon-sm" />
            </button>
          </div>
        </nav>
      );
    }

    function SearchField({ disabled = false, defaultValue = "", icon = "search", label = "Nome do falecido", helper = "Pesquise por nome, período ou referência pública." }) {
      return (
        <label className={`field uikit-field-wide ${disabled ? "is-disabled" : ""}`} data-component="input">
          <span className="field-label">{label}</span>
          <span className="field-control">
            <Icon name={icon} size="icon-sm" />
            <input type="search" placeholder="Nome, setor ou referência" defaultValue={defaultValue} disabled={disabled} />
          </span>
          <span className="field-help">{helper}</span>
        </label>
      );
    }

    function PublicHome() {
      return (
        <section className="uikit-screen" aria-labelledby="public-home-title">
          <Topnav active="consulta" />
          <header className="uikit-screen-header">
            <h2 id="public-home-title" className="uikit-screen-title">Busca pública</h2>
            <p className="uikit-copy">A experiência de entrada do Memoriar acolhe com calma, organiza a pesquisa em poucas decisões e transforma a visita em orientação clara.</p>
          </header>

          <div className="uikit-hero-grid">
            <section className="uikit-stage-card">
              <div className="uikit-section-stack">
                <h3 className="uikit-panel-title">Buscar falecido</h3>
                <p className="uikit-copy">Use nome, período ou referência pública para localizar um registro memorial sem ruído burocrático.</p>
              </div>
              <div className="uikit-input-group">
                <SearchField defaultValue="Maria de Lourdes" />
              </div>
              <div className="uikit-button-row">
                <button type="button" className="btn primary" data-component="button">Buscar falecido</button>
                <button type="button" className="btn secondary" data-component="button">Ver localização</button>
                <button type="button" className="btn ghost" data-component="button" disabled>Busca avançada</button>
              </div>
            </section>

            <section className="uikit-stage-card">
              <div className="uikit-section-stack">
                <h3 className="uikit-panel-title">Orientação calma</h3>
                <p className="uikit-copy">O primeiro contato prioriza leitura respirável, linguagem respeitosa e confirmação gradual das informações sensíveis.</p>
              </div>
              <div className="uikit-chipline" data-component="badge">
                <span className="badge soft info-soft"><span className="tone-dot" aria-hidden="true"></span><span>Publicado</span></span>
                <span className="badge soft success-soft"><span className="tone-dot" aria-hidden="true"></span><span>Localizado</span></span>
                <span className="badge soft warning-soft"><span className="tone-dot" aria-hidden="true"></span><span>Em revisão</span></span>
              </div>
              <div className="uikit-note-block">
                <p className="uikit-microcopy">12 cemitérios integrados • 96% das orientações devolvidas no mesmo dia útil • apoio presencial de 8h às 17h.</p>
              </div>
            </section>
          </div>

          <div className="uikit-airy-grid">
            {homeResults.map((item) => (
              <article key={item.name} className="card uikit-card-tile" data-component="card">
                <div className="uikit-inline-meta">
                  <span className={item.badgeClass} data-component="badge"><span className="tone-dot" aria-hidden="true"></span><span>{item.badgeText}</span></span>
                </div>
                <h3 className="card-title">{item.name}</h3>
                <p className="card-supporting">{item.note}</p>
                <strong className="card-value">{item.value}</strong>
                <div className="card-meta">
                  <span>{item.location}</span>
                  <span>{item.meta}</span>

              </article>

          <section className="uikit-logical-map-shell">

              <section className="map-panel" data-variant-id="public-wayfinding" data-context="public-wayfinding" data-state="selected">

                  <div>
                    <h3 className="panel-title">Mapa lógico</h3>

                      <span className="map-scale">Entrada principal • 140 m</span>
                    </div>
                    <div className="cemetery-grid">
                      <div className="sector">
                        <span className="sector-name">Setor A</span>
                        <span className="sector-meta">Alameda de chegada</span>

                      </div>
                      <div className="sector selected">

                        <div className="sector-lines">

                          <div className="sector-line"></div>
                        </div>
                      </div>
                      <div className="sector">

                      <div className="legend-row"><span className="legend-swatch"></span><span>Áreas de apoio</span></div>
                    </div>
                  </div>
                </div>
              </section>
            </div>
          </section>
        </section>
      );
    }

    function PublicDetail() {
      return (
        <section className="uikit-screen" aria-labelledby="public-detail-title">
          <Topnav active="mapa" />
          <header className="uikit-screen-header">
            <h2 id="public-detail-title" className="uikit-screen-title">Camada de detalhe</h2>
            <p className="uikit-copy">Quando a busca confirma um registro, a leitura lateral preserva contexto, organiza informações delicadas e evita a sensação de ruptura brusca.</p>
          </header>

          <div className="uikit-detail-grid">
            <section className="drawer-scene drawer-scene--delta" data-component="drawer">
              <div className="drawer-scene__content" aria-hidden="true">
                <div>
                  <h3 className="drawer-scene__headline">Maria de Lourdes Souza</h3>
                  <p className="drawer-scene__supporting">Consulta pública confirmada com dados sensíveis apresentados em camadas curtas, sempre com foco em orientação.</p>
                </div>
                <div className="drawer-scene__grid">
                  {detailFacts.slice(0, 4).map((fact) => (
                    <div key={fact.title} className="drawer-scene__card">
                      <strong>{fact.value}</strong>

                </div>
              </div>
              <div className="drawer-scrim"></div>

                <div className="drawer__header">
                  <h3 className="drawer__title">Detalhes do caso</h3>
