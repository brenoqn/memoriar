# Referência versionada do deploy BQTECH. O compose operacional do servidor pode divergir;
# compare os dois antes de qualquer mudança (ver docs/BQTECH-DEPLOYMENT.md).
services:
  memoriar-web:
    image: ghcr.io/brenoqn/memoriar-web:latest
    container_name: bqtech-memoriar-web
    restart: unless-stopped
    depends_on:
      memoriar-api:
        condition: service_healthy
    networks:
      - bqtech-proxy
      - memoriar

  # Aplica migrations pendentes a cada release e termina. Não aplica o seed demonstrativo.
  memoriar-migrate:
    image: ghcr.io/brenoqn/memoriar-api:latest
    container_name: bqtech-memoriar-migrate
    restart: "no"
    command: ["node", "dist/db/cli.js", "migrate"]
    environment:
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
    networks:
      - bqtech-data

  memoriar-api:
    image: ghcr.io/brenoqn/memoriar-api:latest
    container_name: bqtech-memoriar-api
    restart: unless-stopped
    depends_on:
      memoriar-migrate:
        condition: service_completed_successfully
    environment:
      PORT: "3001"
      FRONTEND_ORIGIN: "${FRONTEND_ORIGIN:?FRONTEND_ORIGIN is required}"
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL is required}"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required}"
    expose:
      - "3001"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3001/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - memoriar
      # Rede do bqtech-postgres (container compartilhado da VM bqtech-app01).
      - bqtech-data

networks:
  bqtech-proxy:
    external: true
  bqtech-data:
    external: true
  memoriar:
    internal: true
