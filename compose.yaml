# Ambiente local. O Postgres usa credenciais fixas de desenvolvimento, publicadas só em 127.0.0.1;
# nunca reutilize estes valores fora da sua máquina.
x-local-db-env: &local-db-env
  DATABASE_URL: "postgresql://memoriar_user:memoriar_local_dev@memoriar-db:5432/memoriar_db"
  JWT_SECRET: "segredo-somente-para-desenvolvimento-local-0123456789"

services:
  memoriar-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: memoriar_db
      POSTGRES_USER: memoriar_user
      POSTGRES_PASSWORD: memoriar_local_dev
    volumes:
      - memoriar-db-data:/var/lib/postgresql/data
      - ./backend/db/local:/docker-entrypoint-initdb.d:ro
    ports:
      # Permite rodar `npm run dev` e `npm test` do backend fora do Docker.
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memoriar_user -d memoriar_db"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - local-access
      - memoriar

  # Aplica migrations e o seed demonstrativo e termina.
  memoriar-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["sh", "-c", "node dist/db/cli.js migrate && node dist/db/cli.js seed"]
    environment: *local-db-env
    depends_on:
      memoriar-db:
        condition: service_healthy
    networks:
      - memoriar

  memoriar-web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:18083:80"
    depends_on:
      memoriar-api:
        condition: service_healthy
    networks:
      - local-access
      - memoriar

  memoriar-api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *local-db-env
      PORT: "3001"
      FRONTEND_ORIGIN: "http://localhost:18083"
    expose:
      - "3001"
    depends_on:
      memoriar-migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3001/health",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - memoriar

networks:
  local-access:
  memoriar:
    internal: true

volumes:
  memoriar-db-data:
